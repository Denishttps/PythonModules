[tool.poetry]
name = "matrix-loading"
version = "1.0.0"
description = "Matrix data analysis pipeline - Exercise 1"
authors = ["Data Architect <zion@matrix.net>"]
readme = "README.md"
packages = [{ include = "loading.py" }]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.0.0"
numpy = "^1.24.0"
matplotlib = "^3.7.0"
requests = { version = "^2.31.0", optional = true }

[tool.poetry.extras]
api = ["requests"]

[tool.poetry.group.dev.dependencies]
flake8 = "^6.0.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.flake8]
max-line-length = 88
